<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>X Reels</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="X Reels">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="latest">Latest</button>
      <button class="tab" data-tab="top">Top</button>
      <button class="info-btn" id="info" aria-label="About this feed">ⓘ</button>
    </nav>
    <button class="refresh" id="refresh" aria-label="Refresh">↻</button>
  </header>
  <div class="info-sheet" id="infosheet" hidden></div>
  <div class="scroller" id="scroller"></div>
</div>
<script src="app.js"></script>
</body>
</html>
