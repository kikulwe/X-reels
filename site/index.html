<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Scraper</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
  :root {
    --bg: #0e0f12; --card: #17191e; --line: #262932; --text: #eef0f4; --muted: #8b90a0;
    --accent: #4f8cff; --accent-2: #2f6ae6; --good: #3ecf8e; --bad: #ff6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 90px); }
  header { padding: 18px 16px 6px; }
  h1 { margin: 0; font-size: 24px; letter-spacing: -.02em; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .panel { margin: 12px 16px; padding: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
  .row { display: flex; gap: 8px; }
  input[type=url], input[type=number] {
    flex: 1; min-width: 0; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: 16px; outline: none; }
  input:focus { border-color: var(--accent); }
  button { border: 0; border-radius: 12px; padding: 12px 16px; font-size: 15px; font-weight: 600;
    background: var(--accent); color: #fff; cursor: pointer; }
  button:active { background: var(--accent-2); }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  button:disabled { opacity: .45; }
  .opts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 12px; }
  .opts label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .opts input { padding: 9px 12px; font-size: 15px; }
  .status { margin: 0 16px; min-height: 20px; color: var(--muted); font-size: 13px; }
  .status.err { color: var(--bad); }
  .bar { height: 3px; margin: 6px 16px 0; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin: 14px 16px 8px; font-size: 13px; color: var(--muted); }
  .toolbar button { padding: 6px 12px; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 6px; padding: 0 16px; }
  .tile { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--card); border: 2px solid transparent; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile.sel { border-color: var(--accent); }
  .tile .chk { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid #fff; background: rgba(0,0,0,.35); display: grid; place-items: center; font-size: 13px; }
  .tile.sel .chk { background: var(--accent); border-color: var(--accent); }
  .tile .dim { position: absolute; left: 6px; bottom: 6px; font-size: 10px; padding: 2px 5px; border-radius: 6px; background: rgba(0,0,0,.6); }
  .empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 14px; }
  .dock { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 8px;
    padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px); background: rgba(14,15,18,.92);
    backdrop-filter: blur(12px); border-top: 1px solid var(--line); }
  .dock button { flex: 1; }
  .viewer { position: fixed; inset: 0; background: rgba(0,0,0,.94); display: none; flex-direction: column; z-index: 10; }
  .viewer.open { display: flex; }
  .viewer img, .viewer video { flex: 1; min-height: 0; object-fit: contain; width: 100%; background: #000; }
  .tile video { width: 100%; height: 100%; object-fit: cover; display: block; background: #000; }
  .tile .play { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; font-size: 26px; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.7); }
  .tile .dim.hd { background: var(--accent); }
  .tile .vid-ph { width: 100%; height: 100%; display: grid; place-items: center; color: var(--muted); font-size: 11px; text-align: center; padding: 8px; }
  .checks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .checks label { display: flex; align-items: center; gap: 6px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; cursor: pointer; }
  .checks input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
  .filter { display: flex; gap: 6px; }
  .filter button.on { background: var(--accent); border-color: var(--accent); }
  .viewer .vbar { display: flex; gap: 8px; padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px); }
  .viewer .vbar button { flex: 1; }
  .viewer .vurl { padding: calc(env(safe-area-inset-top) + 12px) 16px 8px; font-size: 11px; color: var(--muted); word-break: break-all; }
</style>
</head>
<body>
<header>
  <h1>Scraper</h1>
  <p>Paste a website link, grab its pictures and videos, save them to your device.</p>
</header>

<form class="panel" id="form">
  <div class="row">
    <input type="url" id="url" placeholder="https://example.com" required autocomplete="url" inputmode="url">
    <button id="go" type="submit">Scrape</button>
  </div>
  <div class="opts">
    <label>Pictures wanted <input type="number" id="target" value="100" min="1" max="1000"></label>
    <label>Max pages <input type="number" id="pages" value="30" min="1" max="100"></label>
    <label>Min size (px) <input type="number" id="minpx" value="100" min="0" step="50"></label>
  </div>
  <div class="checks">
    <label><input type="checkbox" id="wantImg" checked> Pictures</label>
    <label><input type="checkbox" id="wantVid" checked> Videos</label>
    <label><input type="checkbox" id="hdOnly"> HD videos only (720p+)</label>
  </div>
</form>

<div class="status" id="status"></div>
<div class="bar"><i id="prog"></i></div>

<div class="toolbar" id="toolbar" hidden>
  <div class="filter">
    <button class="ghost on" data-f="all" type="button">All</button>
    <button class="ghost" data-f="image" type="button">Pictures</button>
    <button class="ghost" data-f="video" type="button">Videos</button>
  </div>
  <button class="ghost" id="toggleAll" type="button">Select all</button>
</div>
<div class="toolbar" id="toolbar2" hidden style="margin-top:0">
  <span id="count">0 items</span>
</div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty">Nothing yet.</div>

<div class="dock">
  <button class="ghost" id="clear" type="button">Clear</button>
  <button id="save" type="button" disabled>Save selected</button>
</div>

<div class="viewer" id="viewer">
  <div class="vurl" id="vurl"></div>
  <img id="vimg" alt="" referrerpolicy="no-referrer">
  <video id="vvid" controls playsinline hidden></video>
  <div class="vbar">
    <button class="ghost" id="vclose" type="button">Close</button>
    <button id="vsave" type="button">Save</button>
  </div>
</div>

<script>
// Browsers can't read other websites directly (CORS), so we go through free
// services that allow it:
//  - pages: Jina Reader (renders JavaScript too), then public CORS proxies as backup
//  - images: wsrv.nl image proxy, then a CORS proxy as backup
const enc = encodeURIComponent;

async function fetchT(url, opts = {}, ms = 30000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(url, { ...opts, signal: ctrl.signal });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r;
  } catch (e) { throw e.name === "AbortError" ? new Error("timed out") : e; }
  finally { clearTimeout(t); }
}

// Turn Jina's markdown into minimal HTML so the same parser works
function mdToHtml(md) {
  let html = "";
  for (const m of md.matchAll(/!\[[^\]]*\]\((\S+?)(?:\s+"[^"]*")?\)/g)) html += `<img src="${m[1]}">`;
  for (const m of md.matchAll(/(?<!!)\[[^\]]*\]\((\S+?)(?:\s+"[^"]*")?\)/g)) html += `<a href="${m[1]}"></a>`;
  return `<html><body>${html}</body></html>`;
}

const PAGE_SOURCES = [
  ["Jina (rendered)", u => fetchT(`https://r.jina.ai/${u}`, { headers: { "X-Return-Format": "html", "X-Engine": "browser" } }, 45000).then(r => r.text())],
  ["Jina (markdown)", u => fetchT(`https://r.jina.ai/${u}`, {}, 45000).then(r => r.text()).then(mdToHtml)],
  ["AllOrigins", u => fetchT(`https://api.allorigins.win/raw?url=${enc(u)}`).then(r => r.text())],
  ["CodeTabs", u => fetchT(`https://api.codetabs.com/v1/proxy?quest=${enc(u)}`).then(r => r.text())],
];

// Ask every source at once and merge what they return: Jina sees JavaScript-built
// pictures, the raw proxies see the original HTML, and any one of them can be down
// or rate-limited on a given run. Jina markdown is only used if all of them fail.
async function getPageHtmls(url) {
  const errs = [];
  const tryOne = async ([name, get]) => {
    try { const h = await get(url); if (!h || h.length < 50) throw new Error("empty response"); return h; }
    catch (e) { errs.push(`${name}: ${e.message}`); return null; }
  };
  const main = PAGE_SOURCES.filter(([n]) => n !== "Jina (markdown)");
  let htmls = (await Promise.all(main.map(tryOne))).filter(Boolean);
  if (!htmls.length) htmls = [await tryOne(PAGE_SOURCES.find(([n]) => n === "Jina (markdown)"))].filter(Boolean);
  if (!htmls.length) throw new Error(errs.join(" · "));
  return htmls;
}

const imgProxy = src => `https://wsrv.nl/?url=${enc(src)}`;

async function getImageBlob(src) {
  const tries = [
    () => fetchT(src, { referrerPolicy: "no-referrer" }, 15000),
    () => fetchT(imgProxy(src)),
    () => fetchT(`https://api.codetabs.com/v1/proxy?quest=${enc(src)}`),
  ];
  for (const t of tries) {
    try { const b = await (await t()).blob(); if (b.type.startsWith("image/") && b.size) return b; } catch {}
  }
  throw new Error("download failed");
}

const $ = id => document.getElementById(id);
const state = { images: [], selected: new Set(), busy: false };

function setStatus(msg, err) { $("status").textContent = msg; $("status").className = "status" + (err ? " err" : ""); }
function setProg(p) { $("prog").style.width = (p * 100) + "%"; }

const IMG_RE = /\.(jpe?g|png|webp|gif|avif|bmp|heic)(\?|#|$)/i;
const IMG_IN_TEXT = /https?:\\?\/\\?\/(?:[^\s"'<>()\\]|\\\/)+?\.(?:jpe?g|png|webp|gif|avif)(?:\?[^\s"'<>()\\]*)?/gi;
const CSS_URL = /url\(\s*['"]?([^'")]+?\.(?:jpe?g|png|webp|gif|avif)[^'")]*)['"]?\s*\)/gi;

// Pick the largest candidate from a srcset ("a.jpg 320w, b.jpg 1280w")
function bestFromSrcset(ss) {
  let best = null, bestN = -1;
  ss.split(/,\s+(?=\S)/).forEach(part => {
    const [u, d = "1x"] = part.trim().split(/\s+/);
    const n = parseFloat(d) || 1;
    if (u && n >= bestN) { best = u; bestN = n; }
  });
  return best;
}

function findImages(doc, base, raw) {
  const urls = new Set();
  const add = u => {
    if (!u || typeof u !== "string") return;
    u = u.trim().replace(/\\\//g, "/").replace(/&amp;/g, "&");
    if (!u || u.startsWith("data:") || u.startsWith("blob:")) return;
    try { const full = new URL(u, base); full.hash = "";
      if (/^https?:$/.test(full.protocol)) urls.add(full.href); } catch {}
  };
  // 1. Every attribute on <img>/<source>/<picture>/<video poster> — catches any lazy-load naming
  doc.querySelectorAll("img, source, picture, video, image").forEach(el => {
    for (const a of el.attributes) {
      const v = a.value;
      if (/srcset/i.test(a.name)) add(bestFromSrcset(v));
      else if (/^(src|poster|href|xlink:href)$/i.test(a.name) || /^data-/i.test(a.name) && (IMG_RE.test(v) || /^(https?:)?\/\//.test(v))) add(v);
    }
  });
  // 2. Any element whose data-* / href attribute points at an image file (gallery links to full size, lazy backgrounds)
  doc.querySelectorAll("*").forEach(el => {
    for (const a of el.attributes) {
      if ((/^data-/i.test(a.name) || a.name === "href" || a.name === "content") && IMG_RE.test(a.value)) {
        if (a.value.includes(",") && /\s\d+[wx]/.test(a.value)) add(bestFromSrcset(a.value)); else add(a.value);
      }
      if (a.name === "style") for (const m of a.value.matchAll(/url\(\s*['"]?([^'")]+)/g)) add(m[1]);
    }
  });
  // 3. Social preview images
  doc.querySelectorAll('meta[property="og:image"], meta[name="twitter:image"], link[rel="image_src"]')
    .forEach(m => add(m.getAttribute("content") || m.getAttribute("href")));
  // 4. <noscript> fallbacks
  doc.querySelectorAll("noscript").forEach(n => {
    const d = new DOMParser().parseFromString(n.textContent, "text/html");
    d.querySelectorAll("img").forEach(i => { add(i.getAttribute("src")); if (i.srcset) add(bestFromSrcset(i.srcset)); });
  });
  // 5. Image URLs buried in scripts, JSON data and CSS
  if (raw) {
    for (const m of raw.matchAll(IMG_IN_TEXT)) add(m[0]);
    for (const m of raw.matchAll(CSS_URL)) add(m[1]);
  }
  return [...urls];
}

const VID_RE = /\.(mp4|webm|mov|m4v|m3u8|mpd)(\?|#|$)/i;
const VID_IN_TEXT = /https?:\\?\/\\?\/(?:[^\s"'<>()\\]|\\\/)+?\.(?:mp4|webm|mov|m4v|m3u8)(?:\?[^\s"'<>()\\]*)?/gi;

function findVideos(doc, base, raw) {
  const urls = new Set();
  const add = u => {
    if (!u || typeof u !== "string") return;
    u = u.trim().replace(/\\\//g, "/").replace(/&amp;/g, "&");
    if (!u || u.startsWith("blob:") || u.startsWith("data:")) return;
    try { const full = new URL(u, base); full.hash = "";
      if (/^https?:$/.test(full.protocol)) urls.add(full.href); } catch {}
  };
  doc.querySelectorAll("video, video source, audio source").forEach(el => {
    for (const a of el.attributes)
      if (a.name === "src" || (/^data-/i.test(a.name) && VID_RE.test(a.value))) add(a.value);
  });
  doc.querySelectorAll('meta[property^="og:video"], meta[name="twitter:player:stream"]').forEach(m => {
    const c = m.getAttribute("content"); if (c && /^(https?:)?\/\//.test(c) && !/\.(html?|php)(\?|$)/i.test(c)) add(c);
  });
  doc.querySelectorAll("*").forEach(el => {
    for (const a of el.attributes)
      if ((/^data-/i.test(a.name) || a.name === "href" || a.name === "content") && VID_RE.test(a.value)) add(a.value);
  });
  if (raw) for (const m of raw.matchAll(VID_IN_TEXT)) add(m[0]);
  return [...urls];
}

const isStream = u => /\.(m3u8|mpd)(\?|#|$)/i.test(u);
const qualityLabel = h => !h ? "?" : h >= 2160 ? "4K" : h >= 1440 ? "1440p" : h >= 1080 ? "1080p" : h >= 720 ? "720p" : `${h}p`;
// Guess quality from the URL when the browser can't read it (e.g. "..._1080p.mp4", "/720/")
const urlHeight = u => { const m = u.match(/(?:^|[^\d])(2160|1440|1080|720|540|480|360|240)p?(?:[^\d]|$)/); return m ? +m[1] : 0; };

function addVideo(src, page) {
  if (tried.has(src)) return;
  tried.add(src);
  stats.vfound++;
  const hdOnly = $("hdOnly").checked;
  const keep = (w, h, note) => {
    if (hdOnly && h && h < 720) { stats.vlow++; return; }
    const item = { type: "video", src, view: src, page, w, h, note };
    state.images.push(item);
    render(item);
  };
  if (isStream(src)) { // HLS/DASH streams play in pieces; can't be saved as one file here
    const h = urlHeight(src);
    if (hdOnly && h && h < 720) { stats.vlow++; return showSummary(); }
    stats.vstream++; keep(0, h, "stream");
    return showSummary();
  }
  stats.pending++;
  const v = document.createElement("video");
  v.preload = "metadata"; v.muted = true;
  let doneFlag = false;
  const finish = () => { if (doneFlag) return; doneFlag = true; stats.pending--; v.removeAttribute("src"); v.load(); showSummary(); };
  v.onloadedmetadata = () => { keep(v.videoWidth, v.videoHeight || urlHeight(src)); finish(); };
  v.onerror = () => { keep(0, urlHeight(src), "unknown"); finish(); }; // still list it; it may download fine
  setTimeout(() => { if (!doneFlag) { keep(0, urlHeight(src), "unknown"); finish(); } }, 15000);
  v.src = src;
}

const SKIP_LINK = /\/(login|signin|sign-in|register|signup|cart|checkout|account|privacy|terms|cookie|contact|logout|wp-admin|feed)(\/|$|\?)|^mailto:|\.(pdf|zip|rar|exe|dmg|apk|xml|rss|css|js|jpe?g|png|gif|webp|avif|mp4|webm|mov|m3u8)(\?|$)/i;
const GOOD_LINK = /(page|gallery|galler|photo|image|picture|album|post|article|wallpaper|portfolio|collection|product|item|shop|catalog|category|next)/i;

function findLinks(doc, base, host) {
  const out = [];
  doc.querySelectorAll("a[href]").forEach(a => {
    try { const u = new URL(a.getAttribute("href"), base); u.hash = "";
      if (u.host !== host || !/^https?:$/.test(u.protocol) || SKIP_LINK.test(u.href)) return;
      const txt = (a.textContent || "") + " " + (a.getAttribute("rel") || "") + " " + (a.getAttribute("aria-label") || "");
      let score = 0;
      if (/next|more|older|›|»|load/i.test(txt) || a.getAttribute("rel") === "next") score += 6;  // pagination first
      if (/[?&](page|p|pg|offset|start)=\d+|\/page\/\d+/i.test(u.href)) score += 6;
      if (GOOD_LINK.test(u.pathname)) score += 1;
      if (a.querySelector("img")) score += 2;  // thumbnail links usually lead to more pictures
      out.push({ href: u.href, score });
    } catch {}
  });
  return out;
}

const stats = { found: 0, pending: 0, small: 0, failed: 0, extra: 0, vfound: 0, vlow: 0, vstream: 0, crawling: false, pages: 0, pageFails: 0, lastErr: "" };
const tried = new Set();
const run = { target: 100, added: 0 };

function addImage(src, page) {
  if (tried.has(src)) return;
  tried.add(src);
  stats.found++; stats.pending++;
  const minpx = +$("minpx").value || 0;
  const probe = new Image();
  probe.referrerPolicy = "no-referrer";
  const finish = () => { stats.pending--; showSummary(); };
  probe.onload = () => {
    if (probe.naturalWidth < minpx && probe.naturalHeight < minpx) { stats.small++; return finish(); }
    if (run.added >= run.target) { stats.extra++; return finish(); }
    run.added++; setProg(run.added / run.target);
    const item = { type: "image", src, view: probe.src, page, w: probe.naturalWidth, h: probe.naturalHeight };
    state.images.push(item);
    render(item);
    finish();
  };
  probe.onerror = () => { // hotlink-blocked? load through the image proxy
    if (probe.dataset.retried) { stats.failed++; return finish(); }
    probe.dataset.retried = 1;
    probe.src = imgProxy(src);
  };
  probe.src = src;
}

function showSummary() {
  if (stats.crawling) return;
  const n = state.images.length, ok = stats.pages - stats.pageFails;
  if (!stats.pages) return;
  if (!ok) return setStatus(`Couldn't load the site. ${stats.lastErr}`, true);
  const imgs = state.images.filter(i => i.type === "image").length, vids = n - imgs;
  const parts = [`${ok} page${ok === 1 ? "" : "s"}`];
  if ($("wantImg").checked) {
    parts.push(run.added >= run.target ? `✓ ${run.added}/${run.target} pictures` : `${run.added}/${run.target} pictures${stats.pending ? "" : " (site ran out — raise Max pages or lower Min size)"}`);
    if (stats.extra) parts.push(`${stats.extra} extra not shown`);
  }
  if (stats.small) parts.push(`${stats.small} small skipped`);
  if (stats.failed) parts.push(`${stats.failed} wouldn't load`);
  if ($("wantVid").checked) parts.push(`${vids}/${stats.vfound} videos shown`);
  if (stats.vlow) parts.push(`${stats.vlow} below 720p hidden`);
  if (stats.pending) parts.push(`${stats.pending} still checking…`);
  setStatus(parts.join(" · "), !n && !stats.pending);
  updateCount();
}

function render(item) {
  $("empty").hidden = true; $("toolbar").hidden = false;
  $("toolbar2").hidden = false;
  const t = document.createElement("div");
  t.className = "tile";
  if (item.type === "video") {
    const q = item.note === "stream" ? `Stream ${item.h ? qualityLabel(item.h) : ""}` : qualityLabel(item.h);
    const hd = item.h >= 720;
    t.innerHTML = item.note === "stream"
      ? `<div class="vid-ph">▶︎ Live stream<br>(view only)</div><span class="chk">✓</span><span class="dim">${q}</span>`
      : `<video muted playsinline preload="metadata"></video><span class="play">▶︎</span><span class="chk">✓</span><span class="dim${hd ? " hd" : ""}">${q}${hd ? " HD" : ""}</span>`;
    const ve = t.querySelector("video"); if (ve) ve.src = item.src + "#t=0.5";
  } else {
    t.innerHTML = `<img loading="lazy" referrerpolicy="no-referrer" alt=""><span class="chk">✓</span><span class="dim">${item.w}×${item.h}</span>`;
    t.querySelector("img").src = item.view;
  }
  if (filter !== "all" && filter !== item.type) t.hidden = true;
  t.querySelector(".chk").onclick = e => { e.stopPropagation(); toggle(item, t); };
  t.onclick = () => openViewer(item);
  item.el = t;
  $("grid").appendChild(t);
  updateCount();
}

function toggle(item, el) {
  state.selected.has(item) ? state.selected.delete(item) : state.selected.add(item);
  el.classList.toggle("sel", state.selected.has(item));
  updateCount();
}

let filter = "all";
const visible = () => state.images.filter(i => filter === "all" || i.type === filter);

function updateCount() {
  const imgs = state.images.filter(i => i.type === "image").length, vids = state.images.length - imgs;
  const s = state.selected.size, vis = visible();
  $("count").textContent = `${imgs} picture${imgs === 1 ? "" : "s"} · ${vids} video${vids === 1 ? "" : "s"}${s ? ` · ${s} selected` : ""}`;
  $("save").disabled = !s;
  $("save").textContent = s ? `Save ${s}` : "Save selected";
  $("toggleAll").textContent = vis.length && vis.every(i => state.selected.has(i)) ? "Select none" : "Select all";
}

$("toggleAll").onclick = () => {
  const vis = visible();
  const all = !vis.every(i => state.selected.has(i));
  vis.forEach(i => { all ? state.selected.add(i) : state.selected.delete(i); i.el.classList.toggle("sel", all); });
  updateCount();
};

document.querySelectorAll(".filter button").forEach(b => b.onclick = () => {
  filter = b.dataset.f;
  document.querySelectorAll(".filter button").forEach(x => x.classList.toggle("on", x === b));
  state.images.forEach(i => { i.el.hidden = filter !== "all" && filter !== i.type; });
  updateCount();
});

$("clear").onclick = () => {
  state.images = []; state.selected.clear(); $("grid").innerHTML = ""; tried.clear();
  Object.assign(stats, { found: 0, pending: 0, small: 0, failed: 0, extra: 0, vfound: 0, vlow: 0, vstream: 0, pages: 0, pageFails: 0 });
  $("empty").hidden = false; $("toolbar").hidden = true; $("toolbar2").hidden = true; setStatus(""); setProg(0); updateCount();
};

$("form").onsubmit = async e => {
  e.preventDefault();
  if (state.busy) return;
  let start = $("url").value.trim();
  if (!/^https?:\/\//i.test(start)) start = "https://" + start;
  const host = new URL(start).host;
  const maxPages = Math.min(100, Math.max(1, +$("pages").value || 1));
  Object.assign(run, { target: Math.max(1, +$("target").value || 100), added: 0 });
  Object.assign(stats, { crawling: true, pages: 0, pageFails: 0, lastErr: "", found: 0, small: 0, failed: 0, extra: 0, vfound: 0, vlow: 0, vstream: 0 });
  state.images.forEach(i => tried.add(i.src));
  const wantImg = $("wantImg").checked;
  const queue = [{ href: start, score: 99 }], seen = new Set([start]);
  let done = 0;
  const enough = () => wantImg && run.added >= run.target;
  const waitProbes = async () => { for (let i = 0; i < 40 && stats.pending > 0; i++) await new Promise(r => setTimeout(r, 250)); };

  const crawlPage = async page => {
    try {
      for (const html of await getPageHtmls(page)) {
        const doc = new DOMParser().parseFromString(html, "text/html");
        if ($("wantVid").checked) findVideos(doc, page, html).forEach(src => addVideo(src, page));
        if (wantImg) findImages(doc, page, html).forEach(src => addImage(src, page));
        findLinks(doc, page, host).forEach(l => { if (!seen.has(l.href)) { seen.add(l.href); queue.push(l); } });
      }
    } catch (err) { stats.pageFails++; stats.lastErr = err.message; }
    done++; stats.pages = done;
  };

  state.busy = true; $("go").disabled = true;
  localStorageSafe("lastUrl", start);
  try {
    // Keep visiting same-site pages (pagination and gallery links first) until we
    // have the pictures wanted, the site runs out, or Max pages is reached.
    while (queue.length && done < maxPages && !enough()) {
      queue.sort((x, y) => y.score - x.score);
      // optimistic: pictures still being checked will probably count
      const room = maxPages - done, batch = queue.splice(0, Math.min(3, room));
      setStatus(`Page ${done + 1}–${done + batch.length} of up to ${maxPages}${wantImg ? ` · ${run.added}/${run.target} pictures` : ""}…`);
      await Promise.all(batch.map(b => crawlPage(b.href)));
      if (!(run.added + stats.pending >= run.target)) continue;
      await waitProbes();  // let pending checks finish before deciding we're done
    }
    await waitProbes();
    stats.crawling = false; showSummary();
  } finally { state.busy = false; $("go").disabled = false; }
};

async function getVideoBlob(src) {
  const tries = [
    () => fetchT(src, {}, 120000),
    () => fetchT(`https://api.codetabs.com/v1/proxy?quest=${enc(src)}`, {}, 180000),
    () => fetchT(`https://api.allorigins.win/raw?url=${enc(src)}`, {}, 180000),
  ];
  for (const t of tries) {
    try { const b = await (await t()).blob(); if (b.size > 10000 && !/text|html|json/.test(b.type)) return b.type ? b : new Blob([b], { type: "video/mp4" }); } catch {}
  }
  throw new Error("download failed");
}

function fileName(src, blob, i) {
  let name = decodeURIComponent(new URL(src).pathname.split("/").pop() || "file").replace(/[^\w.-]/g, "_").slice(0, 60);
  if (!/\.\w{2,5}$/.test(name)) name += "." + ((blob.type.split("/")[1] || "jpg").replace("jpeg", "jpg").replace("svg+xml", "svg"));
  return i != null ? `${String(i + 1).padStart(3, "0")}_${name}` : name;
}

function downloadBlob(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

async function saveItems(items) {
  const files = [], blocked = [];
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    setStatus(`Downloading ${i + 1}/${items.length}${it.type === "video" ? " (video, may take a while)" : ""}…`); setProg((i + 1) / items.length);
    if (it.note === "stream") { blocked.push(it); continue; }
    try {
      const b = it.type === "video" ? await getVideoBlob(it.src) : await getImageBlob(it.src);
      files.push(new File([b], fileName(it.src, b, items.length > 1 ? i : null), { type: b.type }));
    } catch { if (it.type === "video") blocked.push(it); }
  }
  // Videos the relays couldn't fetch: open the first directly so the browser's own download/save can take it
  const streams = blocked.filter(i => i.note === "stream"), direct = blocked.filter(i => i.note !== "stream");
  let blockedNote = "";
  if (direct.length) {
    blockedNote += ` ${direct.length} video${direct.length > 1 ? "s" : ""} couldn't be fetched here — opened ${direct.length > 1 ? "the first " : ""}in a new tab: use ⋯ / long-press → Download.`;
    window.open(direct[0].src, "_blank", "noopener");
  }
  if (streams.length) blockedNote += ` ${streams.length} live stream${streams.length > 1 ? "s" : ""} can't be saved.`;
  if (!files.length) return setStatus(`Couldn't download those.${blockedNote}`, true);

  // Phones: share sheet lets you "Save to Photos"/"Save Image"
  if (navigator.canShare && navigator.canShare({ files }) && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
    try { await navigator.share({ files }); setStatus(`Shared ${files.length} file(s).${blockedNote}`); return; }
    catch (e) { if (e.name === "AbortError") return setStatus("Cancelled."); }
  }
  if (files.length === 1) { downloadBlob(files[0], files[0].name); }
  else {
    const zip = new JSZip();
    files.forEach(f => zip.file(f.name, f));
    setStatus("Zipping…");
    const host = new URL(items[0].page).host.replace(/[^\w.-]/g, "_");
    downloadBlob(await zip.generateAsync({ type: "blob" }), `${host}_media.zip`);
  }
  const failed = items.length - files.length - blocked.length;
  setStatus(`Saved ${files.length} file(s)${failed > 0 ? ` (${failed} failed)` : ""}.${blockedNote}`);
}

$("save").onclick = async () => { $("save").disabled = true; await saveItems([...state.selected]); updateCount(); };

let viewing = null;
function openViewer(item) {
  viewing = item;
  const isVid = item.type === "video";
  $("vimg").hidden = isVid; $("vvid").hidden = !isVid;
  if (isVid) { $("vvid").src = item.src; $("vvid").play().catch(() => {}); } else $("vimg").src = item.view;
  $("vurl").textContent = item.src + (isVid && item.h ? `  ·  ${qualityLabel(item.h)}` : "");
  $("viewer").classList.add("open");
}
$("vclose").onclick = () => { $("vvid").pause(); $("vvid").removeAttribute("src"); $("viewer").classList.remove("open"); };
$("vsave").onclick = () => viewing && saveItems([viewing]);

function localStorageSafe(k, v) { try { v === undefined ? (v = localStorage.getItem(k)) : localStorage.setItem(k, v); } catch {} return v; }
const last = localStorageSafe("lastUrl"); if (last) $("url").value = last;
const shared = new URLSearchParams(location.search).get("url"); if (shared) $("url").value = shared;
</script>
