<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Make a vintage-style magazine from the 1920s to the 1990s and save it as a PDF.">
<title>Magazine Maker</title>
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,600;1,400&family=Archivo+Black&family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Limelight&family=Lora:ital,wght@0,400;0,700;1,400&family=Nunito:wght@700;900&family=Oswald:wght@500;700&family=Pacifico&family=Permanent+Marker&family=Poiret+One&family=Russo+One&family=Shrikhand&family=Special+Elite&family=VT323&display=swap">
<link rel="stylesheet" href="mag.css">
<style id="pagestyle">@page { size: A4; margin: 0; }</style>
<style>
  :root {
    --bg: #0e0f12; --card: #17191e; --line: #262932; --text: #eef0f4; --muted: #8b90a0;
    --accent: #4f8cff; --accent-2: #2f6ae6; --bad: #ff6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 112px); }
  header { padding: 14px 16px 6px; }
  .apps { display: flex; gap: 6px; margin-bottom: 10px; }
  .apps a { color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 600; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; }
  .apps a.on { color: #fff; background: var(--accent); border-color: var(--accent); }
  h1 { margin: 0; font-size: 24px; letter-spacing: -.02em; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .eras { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px 4px; scrollbar-width: none; }
  .eras::-webkit-scrollbar { display: none; }
  .eras button { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 8px 12px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; font: inherit; }
  .eras button b { font-size: 15px; }
  .eras button small { font-size: 11px; color: var(--muted); }
  .eras button.on { background: var(--accent); border-color: var(--accent); }
  .eras button.on small { color: #e4ecff; }
  .tabs { display: flex; margin: 10px 16px 0; padding: 3px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  .tabs button { flex: 1; border: 0; border-radius: 9px; padding: 9px; background: transparent; color: var(--muted); font: 600 14px/1 inherit; cursor: pointer; }
  .tabs button.on { background: var(--line); color: var(--text); }
  .work { padding: 0 16px; }
  .group { margin: 12px 0; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .group summary { padding: 14px; font-weight: 700; cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
  .group summary::-webkit-details-marker { display: none; }
  .group summary::after { content: "+"; color: var(--muted); font-weight: 400; }
  .group[open] summary::after { content: "−"; }
  .gbody { padding: 0 14px 14px; display: grid; gap: 10px; }
  .field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  .field input, .field textarea, .field select { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: 16px/1.35 inherit; outline: none; resize: vertical; }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
  .check { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
  .check input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; }
  .photo { display: flex; gap: 10px; align-items: center; }
  .thumb { width: 64px; height: 64px; flex: 0 0 64px; border-radius: 10px; border: 1px dashed var(--muted); background: var(--bg) center / cover no-repeat;
    display: grid; place-items: center; text-align: center; font-size: 9px; color: var(--muted); padding: 4px; }
  .pbtns { display: flex; gap: 8px; flex-wrap: wrap; }
  button, .btn { border: 0; border-radius: 12px; padding: 11px 16px; font: 600 15px/1 inherit; background: var(--accent); color: #fff; cursor: pointer; display: inline-block; }
  button:active, .btn:active { background: var(--accent-2); }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  button:disabled { opacity: .45; }
  #preview { padding: 14px 0 4px; }
  .sheet { position: relative; width: 100%; max-width: 640px; margin: 0 auto 16px; overflow: hidden; border-radius: 3px; box-shadow: 0 8px 28px rgba(0,0,0,.55); }
  .sheet .page { transform-origin: 0 0; }
  .mag.measuring .page * { transform: none !important; }
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 8px 16px calc(env(safe-area-inset-bottom) + 12px);
    background: rgba(14,15,18,.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); }
  .dock .row { display: flex; gap: 8px; }
  .dock .row button { flex: 1; }
  .status { min-height: 18px; margin-bottom: 8px; color: var(--muted); font-size: 12.5px; }
  .status.err { color: var(--bad); }
  @media (max-width: 979px) {
    body[data-tab="edit"] #preview { position: fixed; left: -300vw; top: 0; width: calc(100vw - 32px); visibility: hidden; pointer-events: none; }
    body[data-tab="preview"] #editor { display: none; }
  }
  @media (min-width: 980px) {
    .tabs { display: none; }
    .work { display: grid; grid-template-columns: minmax(340px, 420px) 1fr; gap: 24px; align-items: start; }
    #preview { position: sticky; top: 0; max-height: 100vh; overflow-y: auto; padding: 12px 8px 120px; }
    .dock { left: auto; width: min(520px, 100%); right: 24px; bottom: 16px; border: 1px solid var(--line); border-radius: 16px; }
  }
  @media print {
    html, body { background: #fff !important; margin: 0 !important; padding: 0 !important; }
    .no-print { display: none !important; }
    .work { display: block !important; padding: 0 !important; margin: 0 !important; }
    #preview { position: static !important; visibility: visible !important; width: auto !important; max-height: none !important; overflow: visible !important; padding: 0 !important; margin: 0 !important; }
    .sheet { width: auto !important; max-width: none !important; height: auto !important; margin: 0 !important; box-shadow: none !important; border-radius: 0 !important;
      overflow: visible !important; break-after: page; page-break-after: always; }
    .sheet:last-child { break-after: auto; page-break-after: auto; }
    .sheet .page { transform: none !important; }
  }
</style>
</head>
<body>
<header class="no-print">
  <nav class="apps"><a href="../">Scraper</a><a class="on" href="./">Magazine Maker</a></nav>
  <h1>Magazine Maker</h1>
  <p>Pick a decade, write your stories, add photos, then save a 4-page vintage magazine as a PDF.</p>
</header>

<div class="eras no-print" id="eras" role="toolbar" aria-label="Decade"></div>
<div class="tabs no-print" role="tablist">
  <button type="button" data-tab="edit">Edit</button>
  <button type="button" data-tab="preview">Preview</button>
</div>

<main class="work">
  <form id="editor" class="no-print" onsubmit="return false">
    <div id="fields"></div>
    <details class="group"><summary>Page and print</summary><div class="gbody">
      <label class="field"><span>Paper size</span><select id="optSize"><option value="A4">A4</option><option value="Letter">US Letter</option></select></label>
      <label class="check"><input type="checkbox" id="optAged"> Aged paper, fold line and stains</label>
    </div></details>
  </form>
  <div id="preview">
    <div id="pages" class="mag"></div>
  </div>
</main>

<div class="dock no-print">
  <div class="status" id="status" aria-live="polite"></div>
  <div class="row">
    <button type="button" class="ghost" id="sample">Sample <span id="sampleEra">1950s</span> text</button>
    <button type="button" id="pdf">Download PDF</button>
  </div>
</div>

<script src="eras.js"></script>
<script src="art.js"></script>
<script src="app.js"></script>
</body>
</html>
